<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AdVanta Media Dashboard</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#14182b;--mu:#667;--ac:#4f46e5;--ln:#e2e4ee;--ok:#12805c;--wa:#b45309;--er:#c0262d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--card:#1a1e33;--tx:#eceefa;--mu:#9aa0c0;--ac:#8b86ff;--ln:#2b3050;--ok:#3ecf9b;--wa:#f2b24b;--er:#ff7b80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1220;--card:#1a1e33;--tx:#eceefa;--mu:#9aa0c0;--ac:#8b86ff;--ln:#2b3050;--ok:#3ecf9b;--wa:#f2b24b;--er:#ff7b80;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:78px}
header{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}h1 span{color:var(--ac)}h2{font-size:17px;margin:18px 0 8px}h3{font-size:15px;margin:14px 0 6px}
#st{font-size:12px;color:var(--mu)}
main{padding:0 14px 20px;max-width:640px;margin:auto}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.k{font-size:24px;font-weight:700}.mu{color:var(--mu);font-size:13px}
button,select,input,textarea{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);margin:3px 0 8px}
textarea{min-height:110px}
label{font-size:13px;color:var(--mu)}
button{border:0;background:var(--ac);color:#fff;padding:12px 14px;border-radius:10px;font-weight:600;min-height:44px}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.d{background:var(--er)}button:disabled{opacity:.45}
.b{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ln)}
.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;font-size:13px;padding:10px 2px}
nav button.on{color:var(--ac)}
.item{cursor:pointer}
.warn{font-size:13px;background:var(--bg);border:1px dashed var(--wa);border-radius:10px;padding:8px;margin:8px 0}
</style></head><body>
<header><h1>AdVanta <span>Media</span></h1><div id="st">Loading…</div></header>
<main id="m"></main>
<nav id="nav"></nav>
<script>
const STAGES=["New","Contacted","Replied","Proposal Sent","Won","Lost"];
const INDS=["Restaurants, cafés & hotels","Clothing & fashion","Real estate","Beauty, barbershops & spas","E-commerce","Gyms & fitness","Auto dealerships & rentals","Home services","Dentists & local services","Events & entertainment","Other SMB"];
const DEF={biz:"AdVanta Media",name:"[Your Name]",addr:"[Your Business Address, City, State ZIP]",optout:"If you’d rather not hear from me, just reply “no thanks” and I won’t contact you again."};
let S={p:[],sales:[],set:{...DEF}},view="home",cur=null,docRef=null,sample=null,mode="device",tmr=null,flt={q:"",i:"",s:""},armed=null,msg="";
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const uid=()=>Math.random().toString(36).slice(2,10);
const money=n=>"$"+(Number(n)||0).toLocaleString("en-US",{maximumFractionDigits:0});
const P=id=>S.p.find(x=>x.id===id);
function status(t){$("#st").textContent=t}
function save(){
  try{localStorage.setItem("advanta_v1",JSON.stringify(S))}catch(e){}
  clearTimeout(tmr);status("Saving…");
  tmr=setTimeout(async()=>{
    if(docRef){try{await docRef.set({json:JSON.stringify(S)});status("Saved ✓ private cloud");return}catch(e){mode="device"}}
    status("Saved on this phone only")
  },400)
}
async function init(){
  try{const l=localStorage.getItem("advanta_v1");if(l)S=Object.assign(S,JSON.parse(l))}catch(e){}
  render();
  try{
    if(window.claude&&claude.use){
      const u=await claude.use("user"),db=await claude.use("db"),id=u&&await u.id();
      sample=await claude.use("sample");
      if(db&&id){
        docRef=db.collection("data/users/"+id).doc("advanta");
        const snap=await Promise.race([docRef.get(),new Promise((_,r)=>setTimeout(()=>r(0),10000))]);
        if(snap&&snap.exists&&snap.data().json){S=Object.assign({p:[],sales:[],set:{...DEF}},JSON.parse(snap.data().json));mode="cloud"}
        else if(S.p.length||S.sales.length){await docRef.set({json:JSON.stringify(S)});mode="cloud"}
        else mode="cloud";
        status(mode==="cloud"?"Private cloud ✓":"This phone only");render();return
      }
    }
  }catch(e){}
  status("Saved on this phone only");render()
}
function nav(){
  $("#nav").innerHTML=[["home","Home"],["pros","Prospects"],["sales","Sales"],["set","Settings"]].map(([k,l])=>`<button data-go="${k}" class="${view===k||(view==="det"&&k==="pros")?"on":""}">${l}</button>`).join("")
}
function render(){nav();({home:rHome,pros:rPros,det:rDet,sales:rSales,set:rSet})[view]();window.scrollTo(0,0)}
function due(){const t=today();return S.p.filter(x=>x.fu&&x.stage!=="Lost"&&!x.dnc).sort((a,b)=>a.fu<b.fu?-1:1).map(x=>({x,k:x.fu<t?"o":x.fu===t?"t":"u"}))}
function mrr(){return S.p.filter(x=>x.stage==="Won").reduce((a,x)=>a+(Number(x.fee)||0),0)}
function rHome(){
  const d=due(),now=d.filter(z=>z.k!=="u"),up=d.filter(z=>z.k==="u").slice(0,5),mo=today().slice(0,7);
  const mt=S.sales.filter(s=>s.d.startsWith(mo)).reduce((a,s)=>a+s.a,0);
  const row=z=>`<div class="c item" data-open="${z.x.id}"><b>${esc(z.x.name)}</b> <span class="b ${z.k==="o"?"er":""}">${z.k==="o"?"Overdue":z.k==="t"?"Today":"Upcoming"} · ${esc(z.x.fu)}</span><div class="mu">${esc(z.x.stage)}</div></div>`;
  $("#m").innerHTML=`<div class="g"><div class="c"><div class="k">${S.p.filter(x=>!["Won","Lost"].includes(x.stage)).length}</div><div class="mu">Open prospects</div></div>
  <div class="c"><div class="k">${S.p.filter(x=>x.stage==="Won").length}</div><div class="mu">Clients</div></div>
  <div class="c"><div class="k">${money(mrr())}</div><div class="mu">Monthly recurring</div></div>
  <div class="c"><div class="k">${money(mt)}</div><div class="mu">Sales this month</div></div></div>
  <button style="width:100%" data-new="1">+ Add prospect</button>
  <h2>Follow-ups due (${now.length})</h2>${now.map(row).join("")||'<div class="c mu">Nothing due. Set follow-up dates inside a prospect.</div>'}
  ${up.length?"<h2>Coming up</h2>"+up.map(row).join(""):""}
  <h2>Pipeline</h2><div class="c">${STAGES.map(s=>`<div class="row" style="justify-content:space-between"><span>${s}</span><b style="flex:0">${S.p.filter(x=>x.stage===s).length}</b></div>`).join("")}</div>`
}
function rPros(){
  $("#m").innerHTML=`<h2>Prospects & clients</h2><button style="width:100%" data-new="1">+ Add prospect</button>
  <input id="q" placeholder="Search name or city" value="${esc(flt.q)}" style="margin-top:10px">
  <div class="row"><select id="fi"><option value="">All industries</option>${INDS.map(i=>`<option ${flt.i===i?"selected":""}>${esc(i)}</option>`).join("")}</select>
  <select id="fs"><option value="">All stages</option>${STAGES.map(i=>`<option ${flt.s===i?"selected":""}>${i}</option>`).join("")}</select></div><div id="lst"></div>`;
  const draw=()=>{const q=flt.q.toLowerCase();const l=S.p.filter(x=>(!q||(x.name+" "+x.city).toLowerCase().includes(q))&&(!flt.i||x.ind===flt.i)&&(!flt.s||x.stage===flt.s));
    $("#lst").innerHTML=l.map(x=>`<div class="c item" data-open="${x.id}"><b>${esc(x.name)}</b> <span class="b">${esc(x.stage)}</span>${x.dnc?' <span class="b er">Do not contact</span>':""}<div class="mu">${esc(x.ind)} · ${esc([x.city,x.state].filter(Boolean).join(", "))}</div></div>`).join("")||'<div class="c mu">No prospects yet. Tap “Add prospect”.</div>'};
  draw();
  $("#q").oninput=e=>{flt.q=e.target.value;draw()};$("#fi").onchange=e=>{flt.i=e.target.value;draw()};$("#fs").onchange=e=>{flt.s=e.target.value;draw()}
}
function full(p){const s=S.set;return (p.body||"")+"\n\n"+s.name+"\n"+s.biz+"\n"+s.addr+"\n\n"+s.optout}
function blockers(p){const s=S.set,b=[];
  if(!p.email)b.push("Add the prospect’s email address.");if(p.dnc)b.push("Prospect is marked Do not contact.");
  if(!p.subj||!p.body)b.push("Subject and email body are needed.");
  if(/\[.*\]/.test(s.addr))b.push("Replace the placeholder business address in Settings (required by CAN-SPAM).");
  if(/\[.*\]/.test(s.name))b.push("Replace the placeholder name in Settings.");
  if(!p.chk)b.push("Tick the compliance confirmation.");return b}
function appr(p){const b=blockers(p);
  $("#ap").innerHTML=p.ok?`<div class="ok"><b>✓ Approved</b> (${esc(p.okAt||"")})</div><div class="row" style="margin-top:8px"><button data-copy="1">Copy email</button><button data-gmail="1">Open in Gmail</button><button class="s" data-unapp="1">Revoke approval</button></div><div class="mu" style="margin-top:6px">Gmail opens a pre-filled draft. You press Send yourself. After sending, set the stage to Contacted.</div>`
  :`<label><input type="checkbox" id="chk" style="width:auto;margin-right:8px" ${p.chk?"checked":""}>I confirm the subject is honest and this email is accurate. My address and an opt-out line are added automatically.</label>${b.length?`<div class="warn">${b.map(x=>"• "+esc(x)).join("<br>")}</div>`:""}<button data-app="1" ${b.length?"disabled":""} style="width:100%">Approve draft</button>`;
  const c=$("#chk");if(c)c.onchange=e=>{p.chk=e.target.checked;save();appr(p)}}
function rDet(){
  const p=P(cur);if(!p){view="pros";return render()}
  const f=(k,l,t="text")=>`<label>${l}</label><input data-f="${k}" type="${t}" value="${esc(p[k])}">`;
  $("#m").innerHTML=`<div class="row" style="margin-top:10px"><button class="s" data-go="pros">← Back</button></div><h2>${esc(p.name)||"New prospect"}</h2>
  <div class="c">${f("name","Business name")}<label>Industry</label><select data-f="ind">${INDS.map(i=>`<option ${p.ind===i?"selected":""}>${esc(i)}</option>`).join("")}</select>
  <div class="row"><div>${f("city","City")}</div><div>${f("state","State")}</div></div>${f("web","Website")}${f("contact","Contact person")}${f("email","Email","email")}
  <label>Stage</label><select data-f="stage">${STAGES.map(i=>`<option ${p.stage===i?"selected":""}>${i}</option>`).join("")}</select>
  <div id="fee" ${p.stage==="Won"?"":"hidden"}>${f("fee","Monthly fee ($)","number")}${f("since","Client since","date")}</div>
  <label>Notes (what you found out about them)</label><textarea data-f="notes">${esc(p.notes)}</textarea>
  <label>Advertising opportunity (your ideas)</label><textarea data-f="opp">${esc(p.opp)}</textarea>
  <label><input type="checkbox" data-f="dnc" style="width:auto;margin-right:8px" ${p.dnc?"checked":""}>Do not contact</label></div>
  <h2>Follow-up reminder</h2><div class="c"><input type="date" data-f="fu" value="${esc(p.fu)}"><div class="row"><button class="s" data-snz="3">+3 days</button><button class="s" data-snz="7">+7 days</button><button class="s" data-snz="14">+14 days</button><button class="s" data-snz="0">Clear</button></div></div>
  <h2>Proposal & email</h2><div class="c">
  <button data-ai="1" style="width:100%" id="aib">${sample?"✨ Draft with AI":"AI drafting not available"}</button>
  <div class="mu" id="aim">AI uses only the details above. It can’t browse the web, so add notes first. Always review before approving.</div>
  <label style="margin-top:10px">Proposal</label><textarea data-d="prop" style="min-height:200px">${esc(p.prop)}</textarea>
  <label>Email subject</label><input data-d="subj" value="${esc(p.subj)}">
  <label>Email body</label><textarea data-d="body" style="min-height:180px">${esc(p.body)}</textarea>
  <div class="mu">Added automatically when sent: your name, business, address and opt-out line.</div><div id="ap" style="margin-top:10px"></div></div>
  <h2>Delete</h2><button class="${armed===p.id?"d":"s"}" data-del="1" style="width:100%">${armed===p.id?"Tap again to delete for good":"Delete prospect"}</button>`;
  appr(p)
}
function rSales(){
  const cl=S.p.filter(x=>x.stage==="Won"),mo=today().slice(0,7),tot=S.sales.reduce((a,s)=>a+s.a,0),mt=S.sales.filter(s=>s.d.startsWith(mo)).reduce((a,s)=>a+s.a,0);
  $("#m").innerHTML=`<h2>Sales</h2><div class="g"><div class="c"><div class="k">${money(mt)}</div><div class="mu">This month</div></div><div class="c"><div class="k">${money(tot)}</div><div class="mu">All time</div></div></div>
  <div class="c"><b>Log a payment</b><label>Client</label><select id="sc"><option value="">Other / one-off</option>${cl.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select>
  <label>Amount ($)</label><input id="sa" type="number" inputmode="decimal"><label>Date</label><input id="sd" type="date" value="${today()}"><label>Note</label><input id="sn" placeholder="e.g. October ad management fee">
  <div class="warn" id="se" hidden></div><button id="sb" style="width:100%">Add sale</button></div>
  <h2>History</h2>${[...S.sales].sort((a,b)=>a.d<b.d?1:-1).map(s=>`<div class="c row" style="align-items:center"><div><b>${money(s.a)}</b> <span class="mu">${esc(s.d)}</span><div class="mu">${esc(s.n||"")} ${s.c&&P(s.c)?"· "+esc(P(s.c).name):""}</div></div><button class="${armed===s.id?"d":"s"}" style="flex:0 0 auto" data-ds="${s.id}">${armed===s.id?"Confirm":"Delete"}</button></div>`).join("")||'<div class="c mu">No sales logged yet.</div>'}`;
  $("#sb").onclick=()=>{const a=parseFloat($("#sa").value),e=$("#se");if(!(a>0)){e.hidden=false;e.textContent="Enter an amount above 0.";return}
    S.sales.push({id:uid(),c:$("#sc").value,a,d:$("#sd").value||today(),n:$("#sn").value});save();render()}
}
function rSet(){
  const s=S.set,f=(k,l)=>`<label>${l}</label><input data-s="${k}" value="${esc(s[k])}">`;
  $("#m").innerHTML=`<h2>Settings</h2><div class="c">${f("name","Your name (signature)")}${f("biz","Business name")}${f("addr","Business mailing address (required in marketing emails)")}<label>Opt-out line</label><textarea data-s="optout" style="min-height:70px">${esc(s.optout)}</textarea></div>
  <h2>Backup</h2><div class="c"><div class="mu">Your data is private to your account. Back up regularly anyway.</div>
  <button id="ex" style="width:100%;margin-top:8px">Export backup</button><div id="exm" class="mu"></div>
  <textarea id="bk" placeholder="Backup text appears here after export. To restore, paste a backup here and tap Import." style="margin-top:8px"></textarea>
  <button class="s" id="cp" style="width:100%">Copy backup text</button>
  <label style="margin-top:8px">Or choose a backup file</label><input type="file" id="fl" accept=".json,application/json">
  <button id="im" class="s" style="width:100%">Import (replaces current data)</button><div id="imm" class="mu"></div></div>
  <h2>What works / doesn’t yet</h2><div class="c mu">✅ Tracking, follow-ups, sales, drafts, approval, backup.<br>✅ “Open in Gmail” makes a pre-filled draft. You press Send.<br>❌ No automatic discovery of prospects yet. Ask Claude in chat to research businesses, then add them.<br>❌ No automatic sending or reply tracking yet (needs extra Gmail setup).<br>❌ Reminders show in this dashboard only. They don’t send phone notifications.</div>`;
  $("#ex").onclick=async()=>{const data=JSON.stringify(S,null,1);$("#bk").value=data;let d=null;try{d=window.claude&&await claude.use("downloads")}catch(e){}
    if(d){try{await d.save({filename:"advanta-backup-"+today()+".json",data});$("#exm").textContent="Backup file offered for download. The text is also shown above.";return}catch(e){}}
    $("#exm").textContent="Backup text is shown above. Tap “Copy backup text” and paste it into a note or email to yourself."};
  $("#cp").onclick=async()=>{const t=$("#bk");if(!t.value)t.value=JSON.stringify(S,null,1);t.select();try{await navigator.clipboard.writeText(t.value);$("#exm").textContent="Copied ✓"}catch(e){document.execCommand&&document.execCommand("copy");$("#exm").textContent="Selected. Long-press and Copy if needed."}};
  const imp=txt=>{try{const o=JSON.parse(txt);if(!Array.isArray(o.p)||!Array.isArray(o.sales))throw 0;S={p:o.p,sales:o.sales,set:{...DEF,...(o.set||{})}};save();$("#imm").textContent="Imported ✓ "+o.p.length+" prospects.";}catch(e){$("#imm").textContent="That doesn’t look like an AdVanta backup."}};
  $("#im").onclick=()=>imp($("#bk").value);$("#fl").onchange=e=>{const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(e.target.files[0])}
}
async function ai(p){
  const b=$("#aib"),m=$("#aim");if(!sample)return;b.disabled=true;b.textContent="Drafting…";
  const s=S.set,prompt=`You write for ${s.biz}, a US agency that manages Facebook and Instagram ad campaigns for small businesses. Write a short proposal and a first outreach email for this prospect, using ONLY the facts given. Never invent statistics, results, awards or guarantees. Be friendly, specific and honest. Do not claim you saw their ads unless stated.
Business: ${p.name}\nIndustry: ${p.ind}\nLocation: ${p.city}, ${p.state}\nWebsite: ${p.web}\nContact: ${p.contact}\nNotes: ${p.notes}\nAdvertising opportunity ideas: ${p.opp}
Return ONLY JSON: {"proposal":"~200 words with sections: Opportunity, What we’ll do, Next step","subject":"honest, under 60 chars","body":"under 120 words, greet by contact name if known, no signature, no address, no opt-out line"}`;
  try{const r=await sample.json(prompt);p.prop=r.proposal||"";p.subj=r.subject||"";p.body=r.body||"";p.ok=false;p.chk=false;save();render()}
  catch(e){b.disabled=false;b.textContent="✨ Draft with AI";m.innerHTML='<span class="er">AI draft failed ('+esc(e&&e.code||"error")+'). Try again or write the draft yourself.</span>'}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-open]");if(!t)return;const d=t.dataset;
  if(d.go){view=d.go;armed=null;return render()}
  if(d.open){cur=d.open;view="det";return render()}
  if(d.new){const p={id:uid(),name:"",ind:INDS[0],city:"",state:"",web:"",contact:"",email:"",stage:"New",notes:"",opp:"",fu:"",prop:"",subj:"",body:"",ok:false,chk:false,dnc:false,fee:"",since:""};S.p.push(p);cur=p.id;view="det";save();return render()}
  const p=P(cur);
  if(d.snz!==undefined&&p){p.fu=d.snz==="0"?"":addDays(+d.snz);save();return render()}
  if(d.ai&&p)return ai(p);
  if(d.app&&p){if(blockers(p).length)return;p.ok=true;p.okAt=new Date().toLocaleString();save();return appr(p)}
  if(d.unapp&&p){p.ok=false;save();return appr(p)}
  if(d.copy&&p){const t="Subject: "+p.subj+"\n\n"+full(p);navigator.clipboard.writeText(t).then(()=>{t2(e,"Copied ✓")}).catch(()=>{t2(e,"Copy blocked")});return}
  if(d.gmail&&p){if(!p.ok)return;const u="https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(p.email)+"&su="+encodeURIComponent(p.subj)+"&body="+encodeURIComponent(full(p));const w=window.open(u,"_blank");if(!w)t2(e,"Popup blocked. Use Copy email");return}
  if(d.del&&p){if(armed===p.id){S.p=S.p.filter(x=>x!==p);armed=null;view="pros";save();return render()}armed=p.id;return render()}
  if(d.ds){if(armed===d.ds){S.sales=S.sales.filter(s=>s.id!==d.ds);armed=null;save();return render()}armed=d.ds;return render()}
});
function t2(e,x){const b=e.target.closest("button"),o=b.textContent;b.textContent=x;setTimeout(()=>b.textContent=o,1500)}
document.addEventListener("input",e=>{const t=e.target,p=P(cur);
  if(t.dataset.s){S.set[t.dataset.s]=t.value;return save()}
  if(!p)return;
  if(t.dataset.f){const k=t.dataset.f;p[k]=t.type==="checkbox"?t.checked:t.value;
    if(k==="stage"){$("#fee").hidden=p.stage!=="Won";if(p.stage==="Won"&&!p.since)p.since=today()}
    if(k==="email"||k==="dnc"){p.ok=false;appr(p)}save()}
  if(t.dataset.d){p[t.dataset.d]=t.value;if(p.ok){p.ok=false;appr(p)}save()}
});
init();
</script></body></html>
